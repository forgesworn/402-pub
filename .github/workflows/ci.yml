name: Static directory validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/storage-vendor/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: scripts/storage-vendor
      - run: npm run build
        working-directory: scripts/storage-vendor
      - run: git diff --exit-code -- vendor/storage-v1.js
      - run: node --test test/*.test.mjs
      - run: node test/storage-browser.mjs
